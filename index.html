<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV / JSON 変換ツール | techio-code</title>
  <meta name="description" content="CSV・TSV・JSONを双方向に変換。ドラッグ&ドロップ対応・BOM対応で日本語も文字化けなし。完全クライアントサイド処理。">
  <meta property="og:title" content="CSV / JSON 変換ツール">
  <meta property="og:description" content="CSV・TSV・JSONを双方向に変換。ドラッグ&ドロップ対応・BOM対応。">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ===== Dev-Tool Dark Theme ===== */
    :root {
      --bg:          #0D1117;
      --bg-panel:    #161B22;
      --bg-hover:    #1C2128;
      --border:      #30363D;
      --border-active: #58A6FF;
      --text:        #E6EDF3;
      --text-muted:  #8B949E;
      --text-dim:    #484F58;
      --accent:      #58A6FF;
      --accent-2:    #3FB950;
      --error:       #F85149;
      --warning:     #D29922;
      --tab-active:  #58A6FF;
      --tab-bg:      #161B22;
      --mono:        'JetBrains Mono', 'Consolas', monospace;
      --sans:        'Inter', system-ui, sans-serif;
      /* JSON syntax colors */
      --json-key:    #79C0FF;
      --json-str:    #A5D6FF;
      --json-num:    #F2CC60;
      --json-bool:   #FF7B72;
      --json-null:   #FF7B72;
      --json-punc:   #E6EDF3;
      --linenum:     #484F58;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ===== HEADER ===== */
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--bg);
      font-family: var(--mono);
      flex-shrink: 0;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .header-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.15s;
    }
    .icon-btn:hover {
      border-color: var(--border-active);
      color: var(--text);
    }

    /* ===== TABS ===== */
    .tabs-bar {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      gap: 0;
    }
    .tab-btn {
      height: 44px;
      padding: 0 20px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      letter-spacing: 0.01em;
      position: relative;
      bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--tab-active);
      border-bottom-color: var(--tab-active);
      font-weight: 600;
    }
    .tab-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 8px;
    }

    /* ===== TOOLBAR ===== */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }
    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-label {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      font-family: var(--mono);
    }
    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 6px;
    }
    .drop-input {
      height: 34px;
      flex: 1;
      min-width: 160px;
      max-width: 320px;
      padding: 0 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--mono);
      cursor: default;
      display: flex;
      align-items: center;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drop-input.drag-over {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn-toolbar {
      height: 34px;
      padding: 0 14px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-toolbar:hover { border-color: var(--border-active); color: var(--text); }
    .btn-toolbar.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
      font-weight: 600;
    }
    .btn-toolbar.primary:hover { opacity: 0.88; }
    .btn-toolbar.success { background: var(--accent-2); border-color: var(--accent-2); color: var(--bg); }
    select.toolbar-select {
      height: 34px;
      padding: 0 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
      outline: none;
    }
    select.toolbar-select:focus { border-color: var(--accent); }

    /* ===== OPTIONS STRIP ===== */
    .options-strip {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }
    .chk-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }
    .chk-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
    }
    .chk-label:hover { color: var(--text); }

    /* ===== EDITOR LAYOUT ===== */
    .editor-wrap {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      height: calc(100vh - 52px - 44px - 55px - 34px - 38px);
      min-height: 400px;
    }
    .pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .pane:last-of-type { border-right: none; }
    .pane-header {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      flex-shrink: 0;
    }
    .pane-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pane-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 100px;
      font-weight: 600;
    }
    .badge-csv  { background: rgba(88,166,255,0.15); color: #79C0FF; }
    .badge-json { background: rgba(63,185,80,0.15);  color: #56D364; }
    .badge-tsv  { background: rgba(210,153,34,0.15); color: #E3B341; }
    .pane-actions {
      display: flex;
      gap: 4px;
    }
    .pane-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Code area with line numbers */
    .code-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }
    .line-numbers {
      flex-shrink: 0;
      width: 44px;
      padding: 12px 0;
      text-align: right;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      color: var(--linenum);
      user-select: none;
      overflow: hidden;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
    }
    .line-numbers span {
      display: block;
      padding-right: 10px;
    }
    .code-scroll {
      flex: 1;
      overflow: auto;
    }
    .code-scroll textarea {
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: 12px 16px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      caret-color: var(--accent);
      white-space: pre;
      overflow-wrap: normal;
    }
    .code-scroll pre {
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      min-height: 100%;
    }

    /* JSON syntax highlight */
    .json-key   { color: var(--json-key); }
    .json-str   { color: var(--json-str); }
    .json-num   { color: var(--json-num); }
    .json-bool  { color: var(--json-bool); }
    .json-null  { color: var(--json-null); }

    /* ===== DIVIDER (arrow) ===== */
    .pane-divider {
      width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .arrow-icon {
      width: 32px;
      height: 32px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .arrow-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== STATUS BAR (bottom) ===== */
    .status-bar {
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .status-ok  { color: var(--accent-2); }
    .status-err { color: var(--error); }
    .status-info{ color: var(--text-dim); }
    .status-right { display: flex; gap: 16px; }

    /* ===== MODAL (settings / history) ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 60px 24px 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal-panel {
      width: 360px;
      max-height: 70vh;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    /* History items */
    .history-empty {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      padding: 24px 0;
    }
    .hist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }
    .hist-item:hover { background: var(--bg-hover); }
    .hist-mode {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(88,166,255,0.15);
      color: #79C0FF;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hist-preview {
      flex: 1;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hist-date {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .hist-del {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .hist-del:hover { color: var(--error); }

    /* Responsive */
    @media (max-width: 700px) {
      .editor-wrap {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto 1fr;
        height: auto;
      }
      .pane-divider {
        width: 100%;
        height: 40px;
        border-right: none;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .toolbar { padding: 8px 16px; }
      .tabs-bar { padding: 0 16px; }
      .options-strip { padding: 6px 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="header-logo">{ }</div>
    <div>
      <div class="header-title">CSV &lt;&gt; JSON 変換ツール</div>
      <div class="header-sub">Client-side &middot; No upload &middot; Free</div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="btnHistory" title="履歴">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 1a6.5 6.5 0 1 0 0 13A6.5 6.5 0 0 0 7.5 1zm0 1a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2a.5.5 0 0 0-.5.5v3.5h-2a.5.5 0 0 0 0 1h2.5a.5.5 0 0 0 .5-.5V4.5A.5.5 0 0 0 7.5 4z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" title="設定">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.267 1.23a1.25 1.25 0 0 1 1.466 0l.55.401a1.25 1.25 0 0 0 1.078.18l.652-.19a1.25 1.25 0 0 1 1.425.733l.285.61a1.25 1.25 0 0 0 .786.666l.64.19a1.25 1.25 0 0 1 .862 1.307l-.055.671a1.25 1.25 0 0 0 .332 .96l.46.489a1.25 1.25 0 0 1 0 1.706l-.46.489a1.25 1.25 0 0 0-.332.96l.055.671a1.25 1.25 0 0 1-.862 1.307l-.64.19a1.25 1.25 0 0 0-.786.666l-.285.61a1.25 1.25 0 0 1-1.425.733l-.652-.19a1.25 1.25 0 0 0-1.078.18l-.55.401a1.25 1.25 0 0 1-1.466 0l-.55-.401a1.25 1.25 0 0 0-1.078-.18l-.652.19a1.25 1.25 0 0 1-1.425-.733l-.285-.61a1.25 1.25 0 0 0-.786-.666l-.64-.19a1.25 1.25 0 0 1-.862-1.307l.055-.671a1.25 1.25 0 0 0-.332-.96L.75 8.457a1.25 1.25 0 0 1 0-1.706l.46-.489a1.25 1.25 0 0 0 .332-.96L1.487 4.63a1.25 1.25 0 0 1 .862-1.307l.64-.19a1.25 1.25 0 0 0 .786-.666l.285-.61a1.25 1.25 0 0 1 1.425-.733l.652.19a1.25 1.25 0 0 0 1.078-.18l.55-.401zM7.5 5.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<!-- TABS -->
<div class="tabs-bar">
  <button class="tab-btn active" data-mode="csv2json">CSV → JSON</button>
  <button class="tab-btn" data-mode="json2csv">JSON → CSV</button>
  <button class="tab-btn" data-mode="tsv2json">TSV → JSON</button>
  <div class="tab-sep"></div>
  <button class="tab-btn" data-mode="auto" id="tabAuto">自動判定</button>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="drop-input" id="dropInput" title="ファイルをドラッグ&ドロップ">
    <svg width="13" height="13" viewBox="0 0 15 15" fill="none" style="margin-right:6px;flex-shrink:0"><path d="M3 2a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V6.5l-4-4.5H3zm5 0L13 6h-4a1 1 0 0 1-1-1V2z" fill="currentColor"/></svg>
    <span id="dropInputText">ファイルをドラッグ&ドロップ、または...</span>
  </div>
  <button class="btn-toolbar" id="btnFileOpen">ファイルを開く</button>
  <div class="toolbar-sep"></div>
  <button class="btn-toolbar" id="btnConvert" style="background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600;">変換する</button>
  <button class="btn-toolbar" id="btnClear">クリア</button>
  <div class="toolbar-sep"></div>
  <button class="btn-toolbar" id="btnCopy">
    <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M5 1a1 1 0 0 0-1 1v1H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1v-1h1a1 1 0 0 0 1-1V6l-4-4-1-1H5zm1 1h2v3a1 1 0 0 0 1 1h3v6H6V2zm3 .7L11.3 5H9V2.7z" fill="currentColor"/></svg>
    コピー
  </button>
  <button class="btn-toolbar" id="btnDownload">
    <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M7.5 1a.5.5 0 0 1 .5.5v7.793l2.146-2.147a.5.5 0 0 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-3-3a.5.5 0 0 1 .708-.708L7 9.293V1.5a.5.5 0 0 1 .5-.5zM1 13.5a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5z" fill="currentColor"/></svg>
    DL
  </button>
  <button class="btn-toolbar" id="btnSaveHistory">
    <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M3 1a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V5l-4-4H3zm0 1h5v3a1 1 0 0 0 1 1h3v7H3V2zm6 .7L11.3 5H9V2.7z" fill="currentColor"/></svg>
    保存
  </button>
</div>

<!-- OPTIONS STRIP -->
<div class="options-strip">
  <div class="toolbar-section">
    <span class="toolbar-label">区切り</span>
    <select class="toolbar-select" id="selDelimiter">
      <option value="auto">自動</option>
      <option value=",">,</option>
      <option value="	">\t</option>
      <option value=";">;</option>
      <option value="|">|</option>
    </select>
  </div>
  <label class="chk-label"><input type="checkbox" id="chkHeader" checked> 1行目をヘッダーに</label>
  <label class="chk-label"><input type="checkbox" id="chkPretty" checked> JSON整形</label>
  <label class="chk-label"><input type="checkbox" id="chkBom" checked> BOM付きUTF-8</label>
  <label class="chk-label"><input type="checkbox" id="chkAutoConvert" checked> 自動変換</label>
</div>

<!-- EDITOR -->
<div class="editor-wrap">
  <!-- Input Pane -->
  <div class="pane" id="paneInput">
    <div class="pane-header">
      <div class="pane-title">
        INPUT
        <span class="pane-badge badge-csv" id="inputBadge">CSV</span>
      </div>
      <div class="pane-actions">
        <button class="icon-btn" id="btnPasteClip" title="クリップボードから貼付" style="width:26px;height:26px;font-size:11px;">
          <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M5 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1h-2V1a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v1zm1-1h3v2H6V1zm-3 2h9v10H3V3z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="code-container" id="inputDropZone">
      <div class="line-numbers" id="inputLineNums"><span>1</span></div>
      <div class="code-scroll">
        <textarea id="inputArea" spellcheck="false" autocomplete="off" placeholder="ここにCSV/TSV/JSONをペースト&#10;またはファイルをドラッグ&ドロップ"></textarea>
      </div>
    </div>
  </div>

  <!-- Arrow divider -->
  <div class="pane-divider">
    <div class="arrow-icon" id="btnSwap" title="入出力を入替">&#8651;</div>
  </div>

  <!-- Output Pane -->
  <div class="pane" id="paneOutput">
    <div class="pane-header">
      <div class="pane-title">
        OUTPUT
        <span class="pane-badge badge-json" id="outputBadge">JSON</span>
      </div>
      <span class="pane-meta" id="outputMeta"></span>
    </div>
    <div class="code-container">
      <div class="line-numbers" id="outputLineNums"><span>1</span></div>
      <div class="code-scroll">
        <pre id="outputArea"><span style="color:var(--text-dim)">変換結果がここに表示されます</span></pre>
      </div>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <span id="statusMsg" class="status-info">準備完了 — CSV/TSV/JSON をペーストして変換してください</span>
  <div class="status-right">
    <span id="statusRows"></span>
    <span id="statusSize"></span>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="modal-overlay" id="historyModal">
  <div class="modal-panel">
    <div class="modal-header">
      <span class="modal-title">変換履歴</span>
      <button class="modal-close" id="closeHistory">&times;</button>
    </div>
    <div class="modal-body">
      <div id="historyList"></div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-panel">
    <div class="modal-header">
      <span class="modal-title">設定</span>
      <button class="modal-close" id="closeSettings">&times;</button>
    </div>
    <div class="modal-body" style="font-size:13px;color:var(--text-muted);">
      <p style="margin-bottom:12px;color:var(--text);">変換オプションはツールバーから設定できます。</p>
      <p style="margin-bottom:8px;font-family:var(--mono);font-size:11px;">バージョン: v2.0</p>
      <p style="font-family:var(--mono);font-size:11px;">© techio-code</p>
    </div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".csv,.tsv,.json,.txt" style="display:none">

<script>
// ===== State =====
let currentMode = 'csv2json';
const HIST_KEY = 'csv_json_history_v2';
const MAX_HIST = 20;

// ===== Mode selector =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    updateBadges();
    if (document.getElementById('chkAutoConvert').checked) {
      const val = document.getElementById('inputArea').value.trim();
      if (val) doConvert();
    }
  });
});

function updateBadges() {
  const modes = {
    'csv2json': { input: 'CSV', output: 'JSON', inClass: 'badge-csv', outClass: 'badge-json' },
    'json2csv': { input: 'JSON', output: 'CSV', inClass: 'badge-json', outClass: 'badge-csv' },
    'tsv2json': { input: 'TSV', output: 'JSON', inClass: 'badge-tsv', outClass: 'badge-json' },
    'auto':     { input: 'AUTO', output: '?',   inClass: 'badge-tsv', outClass: 'badge-csv' },
  };
  const m = modes[currentMode] || modes['csv2json'];
  const ib = document.getElementById('inputBadge');
  const ob = document.getElementById('outputBadge');
  ib.textContent = m.input;
  ib.className = 'pane-badge ' + m.inClass;
  ob.textContent = m.output;
  ob.className = 'pane-badge ' + m.outClass;
}

// ===== Line numbers =====
function updateLineNums(text, elId) {
  const el = document.getElementById(elId);
  const lines = text ? text.split('\n').length : 1;
  el.innerHTML = Array.from({length: lines}, (_, i) => `<span>${i + 1}</span>`).join('');
}

function syncInputLineNums() {
  updateLineNums(document.getElementById('inputArea').value, 'inputLineNums');
}

function syncOutputLineNums(text) {
  updateLineNums(text || '', 'outputLineNums');
}

// ===== CSV parser (RFC 4180) =====
function stripBom(str) {
  return str.charCodeAt(0) === 0xFEFF ? str.slice(1) : str;
}

function parseCsv(text, delimiter) {
  text = stripBom(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  if (delimiter === 'auto') delimiter = detectDelimiter(text);
  const rows = [];
  let row = [], field = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuote) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuote = false;
      } else { field += c; }
    } else if (c === '"') {
      inQuote = true;
    } else if (c === delimiter) {
      row.push(field); field = '';
    } else if (c === '\n') {
      row.push(field); field = '';
      rows.push(row); row = [];
    } else { field += c; }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  while (rows.length > 0 && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  return { rows, delimiter };
}

function detectDelimiter(text) {
  const firstLine = text.split('\n')[0];
  const counts = {
    ',': (firstLine.match(/,/g) || []).length,
    '\t': (firstLine.match(/\t/g) || []).length,
    ';': (firstLine.match(/;/g) || []).length,
    '|': (firstLine.match(/\|/g) || []).length,
  };
  return Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b);
}

// ===== Auto-detect mode =====
function autoDetectMode(text) {
  text = text.trim();
  if (text.startsWith('[') || text.startsWith('{')) return 'json2csv';
  if (text.includes('\t')) return 'tsv2json';
  return 'csv2json';
}

// ===== CSV → JSON =====
function csvToJson(text, delimiter, hasHeader, pretty) {
  const { rows } = parseCsv(text, delimiter);
  if (rows.length === 0) throw new Error('データが空です');
  if (hasHeader) {
    const headers = rows[0];
    const data = rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = inferType(row[i] !== undefined ? row[i] : ''); });
      return obj;
    });
    return pretty ? JSON.stringify(data, null, 2) : JSON.stringify(data);
  } else {
    return pretty ? JSON.stringify(rows, null, 2) : JSON.stringify(rows);
  }
}

function inferType(val) {
  if (val === '') return val;
  if (val === 'true') return true;
  if (val === 'false') return false;
  if (val === 'null') return null;
  const num = Number(val);
  if (!isNaN(num) && val.trim() !== '') return num;
  return val;
}

// ===== JSON → CSV =====
function jsonToCsv(text, delimiter) {
  if (delimiter === 'auto') delimiter = ',';
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error('JSONの解析に失敗: ' + e.message); }
  if (!Array.isArray(data)) {
    if (typeof data === 'object' && data !== null) data = [data];
    else throw new Error('配列またはオブジェクトのJSONが必要です');
  }
  if (data.length === 0) return '';
  const keys = [...new Set(data.flatMap(row => Object.keys(row)))];
  const csvRows = [keys.map(k => csvEscape(k, delimiter))];
  data.forEach(row => csvRows.push(keys.map(k => csvEscape(row[k] !== undefined ? String(row[k]) : '', delimiter))));
  return csvRows.map(r => r.join(delimiter)).join('\r\n');
}

function csvEscape(val, delimiter) {
  if (typeof val !== 'string') val = String(val);
  if (val.includes('"') || val.includes(delimiter) || val.includes('\n') || val.includes('\r')) {
    return '"' + val.replace(/"/g, '""') + '"';
  }
  return val;
}

// ===== JSON Syntax Highlight =====
function highlightJson(json) {
  if (!json) return '';
  return json
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"([^"\\]*(\\.[^"\\]*)*)"(\s*:)/g, '<span class="json-key">"$1"</span>$3')
    .replace(/:(\s*)"([^"\\]*(\\.[^"\\]*)*)"/g, ':$1<span class="json-str">"$2"</span>')
    .replace(/:(\s*)(-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, ':$1<span class="json-num">$2</span>')
    .replace(/:(\s*)(true|false)/g, ':$1<span class="json-bool">$2</span>')
    .replace(/:(\s*)(null)/g, ':$1<span class="json-null">$2</span>');
}

// ===== Convert =====
function doConvert() {
  const input = document.getElementById('inputArea').value.trim();
  const outputEl = document.getElementById('outputArea');
  const delimiter = document.getElementById('selDelimiter').value;
  const hasHeader = document.getElementById('chkHeader').checked;
  const pretty    = document.getElementById('chkPretty').checked;

  if (!input) {
    outputEl.innerHTML = '<span style="color:var(--text-dim)">変換結果がここに表示されます</span>';
    syncOutputLineNums('');
    setStatus('info', '入力待ち', '', '');
    document.getElementById('outputBadge').textContent = '?';
    return;
  }

  let mode = currentMode;
  if (mode === 'auto') {
    mode = autoDetectMode(input);
    const modeNames = { csv2json: 'CSV→JSON', json2csv: 'JSON→CSV', tsv2json: 'TSV→JSON' };
    document.getElementById('statusMsg').textContent = '自動判定: ' + (modeNames[mode] || mode);
  }

  try {
    let result;
    if (mode === 'csv2json' || mode === 'tsv2json') {
      const delim = mode === 'tsv2json' ? '\t' : delimiter;
      result = csvToJson(input, delim, hasHeader, pretty);
      const outBadge = document.getElementById('outputBadge');
      outBadge.textContent = 'JSON';
      outBadge.className = 'pane-badge badge-json';
    } else {
      result = jsonToCsv(input, delimiter);
      const outBadge = document.getElementById('outputBadge');
      outBadge.textContent = 'CSV';
      outBadge.className = 'pane-badge badge-csv';
    }

    // Display with syntax highlight for JSON
    if (mode !== 'json2csv') {
      outputEl.innerHTML = highlightJson(result);
    } else {
      outputEl.textContent = result;
    }
    syncOutputLineNums(result);

    const lines = result.split('\n').length;
    const bytes = new TextEncoder().encode(result).length;
    const kb = (bytes / 1024).toFixed(1);
    if (currentMode !== 'auto') {
      setStatus('ok', '変換成功', lines + ' 行', kb + ' KB');
    } else {
      setStatus('ok', '自動判定 OK', lines + ' 行', kb + ' KB');
    }
  } catch (e) {
    outputEl.textContent = '// Error: ' + e.message;
    syncOutputLineNums('// Error: ' + e.message);
    setStatus('err', 'エラー: ' + e.message, '', '');
  }
}

function setStatus(type, msg, rows, size) {
  document.getElementById('statusMsg').className = 'status-' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info');
  document.getElementById('statusMsg').textContent = msg;
  document.getElementById('statusRows').textContent = rows || '';
  document.getElementById('statusSize').textContent = size || '';
}

document.getElementById('btnConvert').addEventListener('click', doConvert);

// Auto-convert on input change
let debTimer;
document.getElementById('inputArea').addEventListener('input', () => {
  syncInputLineNums();
  if (document.getElementById('chkAutoConvert').checked) {
    clearTimeout(debTimer);
    debTimer = setTimeout(doConvert, 500);
  }
});

// ===== Copy =====
document.getElementById('btnCopy').addEventListener('click', async () => {
  const text = document.getElementById('outputArea').textContent;
  if (!text || text === '変換結果がここに表示されます') return;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('btnCopy');
    const orig = btn.innerHTML;
    btn.className = 'btn-toolbar success';
    btn.textContent = '✓ コピー完了';
    setTimeout(() => { btn.className = 'btn-toolbar'; btn.innerHTML = orig; }, 1800);
  } catch {
    setStatus('err', 'クリップボードへのコピーに失敗しました', '', '');
  }
});

// ===== Download =====
document.getElementById('btnDownload').addEventListener('click', () => {
  const text = document.getElementById('outputArea').textContent;
  if (!text || text.startsWith('変換結果')) return;
  const isJson = currentMode !== 'json2csv';
  const ext = isJson ? 'json' : 'csv';
  const mime = isJson ? 'application/json' : 'text/csv';
  const bom = document.getElementById('chkBom').checked && !isJson;
  const bytes = bom
    ? new Uint8Array([0xEF, 0xBB, 0xBF, ...new TextEncoder().encode(text)])
    : new TextEncoder().encode(text);
  const blob = new Blob([bytes], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'converted.' + ext; a.click();
  URL.revokeObjectURL(url);
});

// ===== Paste from clipboard =====
document.getElementById('btnPasteClip').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputArea').value = text;
    syncInputLineNums();
    doConvert();
  } catch {
    setStatus('err', 'クリップボードの読み取りに失敗（ブラウザ許可が必要）', '', '');
  }
});

// ===== Clear =====
document.getElementById('btnClear').addEventListener('click', () => {
  document.getElementById('inputArea').value = '';
  document.getElementById('outputArea').innerHTML = '<span style="color:var(--text-dim)">変換結果がここに表示されます</span>';
  syncInputLineNums();
  syncOutputLineNums('');
  setStatus('info', 'クリアしました', '', '');
});

// ===== Swap =====
document.getElementById('btnSwap').addEventListener('click', () => {
  const out = document.getElementById('outputArea').textContent.trim();
  if (!out || out.startsWith('変換結果') || out.startsWith('// Error')) return;
  document.getElementById('inputArea').value = out;
  syncInputLineNums();
  if (currentMode === 'csv2json') {
    document.querySelector('[data-mode="json2csv"]').click();
  } else if (currentMode === 'json2csv') {
    document.querySelector('[data-mode="csv2json"]').click();
  } else {
    doConvert();
  }
});

// ===== File open =====
document.getElementById('btnFileOpen').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  readFile(file);
  e.target.value = '';
});

function readFile(file) {
  document.getElementById('dropInputText').textContent = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    let text = stripBom(ev.target.result);
    document.getElementById('inputArea').value = text;
    syncInputLineNums();
    if (file.name.endsWith('.json')) {
      document.querySelector('[data-mode="json2csv"]').click();
    } else if (file.name.endsWith('.tsv')) {
      document.querySelector('[data-mode="tsv2json"]').click();
    } else {
      document.querySelector('[data-mode="csv2json"]').click();
    }
    doConvert();
  };
  reader.readAsText(file, 'UTF-8');
}

// ===== Drag & Drop (toolbar + input pane) =====
function setupDrop(el, onFile, onText) {
  ['dragenter', 'dragover'].forEach(evt => {
    el.addEventListener(evt, e => {
      e.preventDefault();
      el.classList.add('drag-over');
      document.getElementById('dropInput').classList.add('drag-over');
      document.getElementById('dropInputText').textContent = 'ドロップしてください...';
    });
  });
  ['dragleave', 'drop'].forEach(evt => {
    el.addEventListener(evt, e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      document.getElementById('dropInput').classList.remove('drag-over');
    });
  });
  el.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) { onFile(file); return; }
    const text = e.dataTransfer.getData('text');
    if (text && onText) onText(text);
  });
}

setupDrop(document.getElementById('inputDropZone'),
  file => readFile(file),
  text => {
    document.getElementById('inputArea').value = text;
    syncInputLineNums();
    doConvert();
  }
);

setupDrop(document.getElementById('dropInput'),
  file => readFile(file),
  null
);

// ===== History =====
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function saveHistory(hist) {
  localStorage.setItem(HIST_KEY, JSON.stringify(hist));
}
function renderHistory() {
  const hist = loadHistory();
  const list = document.getElementById('historyList');
  if (hist.length === 0) {
    list.innerHTML = '<div class="history-empty">履歴はまだありません</div>';
    return;
  }
  list.innerHTML = '';
  hist.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    div.innerHTML = `
      <span class="hist-mode">${escHtml(item.mode)}</span>
      <span class="hist-preview">${escHtml(item.preview)}</span>
      <span class="hist-date">${escHtml(item.date)}</span>
      <button class="hist-del" data-idx="${idx}" title="削除">&times;</button>
    `;
    div.addEventListener('click', e => {
      if (e.target.classList.contains('hist-del')) return;
      document.getElementById('inputArea').value = item.input;
      syncInputLineNums();
      const modeBtn = document.querySelector(`[data-mode="${item.mode}"]`);
      if (modeBtn) modeBtn.click();
      doConvert();
      closeAllModals();
    });
    div.querySelector('.hist-del').addEventListener('click', e => {
      e.stopPropagation();
      const h = loadHistory();
      h.splice(idx, 1);
      saveHistory(h);
      renderHistory();
    });
    list.appendChild(div);
  });
}

document.getElementById('btnSaveHistory').addEventListener('click', () => {
  const input = document.getElementById('inputArea').value.trim();
  if (!input) { setStatus('err', '保存する内容がありません', '', ''); return; }
  const hist = loadHistory();
  hist.unshift({
    mode: currentMode,
    input,
    preview: input.slice(0, 60),
    date: new Date().toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
  });
  if (hist.length > MAX_HIST) hist.pop();
  saveHistory(hist);
  setStatus('ok', '履歴に保存しました', '', '');
});

// ===== Modals =====
function closeAllModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
}
document.getElementById('btnHistory').addEventListener('click', () => {
  renderHistory();
  closeAllModals();
  document.getElementById('historyModal').classList.add('open');
});
document.getElementById('closeHistory').addEventListener('click', closeAllModals);
document.getElementById('btnSettings').addEventListener('click', () => {
  closeAllModals();
  document.getElementById('settingsModal').classList.add('open');
});
document.getElementById('closeSettings').addEventListener('click', closeAllModals);
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) closeAllModals(); });
});

// ===== Escape helper =====
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== Init =====
updateBadges();
syncInputLineNums();
syncOutputLineNums('');
</script>
</body>
</html>
