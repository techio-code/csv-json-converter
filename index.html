  <meta property="og:title" content="CSV / JSON コンバーター">
  <meta property="og:description" content="CSV・TSV・JSONを双方向に変換。ドラッグ&ドロップ対応・BOM対応。">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ===== Design System: Mode B The Row ===== */
    :root {
      --row-paper:   #F5F4F0;
      --row-ink:     #1C1C1C;
      --row-tan:     #C8B89E;
      --row-stone:   #6B6B66;
      --row-coffee:  #8B6F47;
      --primary:     #6C63FF;
      --success:     #00D4AA;
      --error:       #FF5252;
      --warning:     #FBA32A;
      --font-sans:   'Noto Sans JP', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--row-paper);
      color: var(--row-ink);
      min-height: 100vh;
      font-size: 16px;
      line-height: 1.8;
    }
    /* ===== PRO UPGRADE 2026-05-31 ===== */
    /* Header */
    header {
      border-bottom: 1px solid var(--row-tan);
      padding: 0 48px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      background: var(--row-paper);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-accent {
      width: 2px;
      height: 20px;
      background: var(--primary);

    }
    header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--row-ink);
    }
    header .subtitle {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--row-stone);
      opacity: 0.7;
    }
    .header-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--row-stone);
      border: 1px solid var(--row-tan);
      padding: 3px 10px;
      border-radius: 100px;
    }
    /* Layout */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 48px 64px;
    }
    /* Pane label — ワイドトラッキング */
    .pane-label {
      font-family: var(--font-mono) !important;
      font-size: 10px !important;
      font-weight: 500 !important;

    /* Controls bar */

      border-bottom: 1px solid var(--row-tan);
    }
    /* Drop zone — border-radius統一 */

      border: 1px solid var(--row-tan) !important;
    }
    .drop-zone.drag-over {

    /* Output pane */

    /* History section heading */

    /* Controls bar */

    /* Options row */

<header>

<main>
  <!-- Mode selector -->

<footer>techio-code — CSV / JSON Converter v1.0</footer>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".csv,.tsv,.json,.txt" style="display:none">

<script>
  // ===== State =====
  let currentMode = 'csv2json';
  const HIST_KEY = 'csv_json_history';
  const MAX_HIST = 10;

  // ===== Mode selector =====
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      updateBadges();
    });
  });

  function updateBadges() {
    const modes = {
      'csv2json': { input: 'CSV', output: 'JSON' },
      'json2csv': { input: 'JSON', output: 'CSV' },
      'tsv2json': { input: 'TSV', output: 'JSON' },
    };
    const m = modes[currentMode] || { input: 'CSV/TSV/JSON', output: 'JSON' };
    document.getElementById('inputBadge').textContent = m.input;
    document.getElementById('outputBadge').textContent = m.output;
  }

  // ===== CSV parser (RFC 4180 準拠・BOM対応) =====
  function stripBom(str) {
    return str.charCodeAt(0) === 0xFEFF ? str.slice(1) : str;
  }

  function parseCsv(text, delimiter) {
    text = stripBom(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (delimiter === 'auto') delimiter = detectDelimiter(text);
    const rows = [];
    let row = [], field = '', inQuote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuote) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuote = false;
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuote = true;
      } else if (c === delimiter) {
        row.push(field); field = '';
      } else if (c === '\n') {
        row.push(field); field = '';
        rows.push(row); row = [];
      } else {
        field += c;
      }
    }
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    // remove trailing empty row
    while (rows.length > 0 && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') {
      rows.pop();
    }
    return { rows, delimiter };
  }

  function detectDelimiter(text) {
    const firstLine = text.split('\n')[0];
    const counts = {
      ',': (firstLine.match(/,/g) || []).length,
      '\t': (firstLine.match(/\t/g) || []).length,
      ';': (firstLine.match(/;/g) || []).length,
      '|': (firstLine.match(/\|/g) || []).length,
    };
    return Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b);
  }

  // ===== CSV → JSON =====
  function csvToJson(text, delimiter, hasHeader, pretty) {
    const { rows } = parseCsv(text, delimiter);
    if (rows.length === 0) throw new Error('データが空です');
    if (hasHeader) {
      const headers = rows[0];
      const data = rows.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, i) => {
          const val = row[i] !== undefined ? row[i] : '';
          obj[h] = inferType(val);
        });
        return obj;
      });
      return pretty ? JSON.stringify(data, null, 2) : JSON.stringify(data);
    } else {
      return pretty ? JSON.stringify(rows, null, 2) : JSON.stringify(rows);
    }
  }

  function inferType(val) {
    if (val === '' || val === null || val === undefined) return val;
    if (val === 'true') return true;
    if (val === 'false') return false;
    if (val === 'null') return null;
    const num = Number(val);
    if (!isNaN(num) && val.trim() !== '') return num;
    return val;
  }

  // ===== JSON → CSV =====
  function jsonToCsv(text, delimiter) {
    if (delimiter === 'auto') delimiter = ',';
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('JSONの解析に失敗しました: ' + e.message); }
    if (!Array.isArray(data)) {
      if (typeof data === 'object' && data !== null) data = [data];
      else throw new Error('配列またはオブジェクトのJSONが必要です');
    }
    if (data.length === 0) return '';
    const keys = [...new Set(data.flatMap(row => Object.keys(row)))];
    const csvRows = [keys.map(k => csvEscape(k, delimiter))];
    data.forEach(row => {
      csvRows.push(keys.map(k => csvEscape(row[k] !== undefined ? String(row[k]) : '', delimiter)));
    });
    return csvRows.map(r => r.join(delimiter)).join('\r\n');
  }

  function csvEscape(val, delimiter) {
    if (typeof val !== 'string') val = String(val);
    if (val.includes('"') || val.includes(delimiter) || val.includes('\n') || val.includes('\r')) {
      return '"' + val.replace(/"/g, '""') + '"';
    }
    return val;
  }

  // ===== Convert =====
  function doConvert() {
    const input = document.getElementById('inputArea').value.trim();
    const outputEl = document.getElementById('outputArea');
    const statusEl = document.getElementById('statusBar');
    const delimiter = document.getElementById('selDelimiter').value;
    const hasHeader = document.getElementById('chkHeader').checked;
    const pretty    = document.getElementById('chkPretty').checked;

    if (!input) {
      setStatus('err', '入力が空です');
      return;
    }

    try {
      let result;
      if (currentMode === 'csv2json' || currentMode === 'tsv2json') {
        const delim = currentMode === 'tsv2json' ? '\t' : delimiter;
        result = csvToJson(input, delim, hasHeader, pretty);
      } else {
        result = jsonToCsv(input, delimiter);
      }
      outputEl.textContent = result;
      const lines = result.split('\n').length;
      const bytes = new TextEncoder().encode(result).length;
      setStatus('ok', `変換成功 — ${lines} 行 / ${(bytes / 1024).toFixed(1)} KB`);
    } catch (e) {
      outputEl.textContent = '// エラー: ' + e.message;
      setStatus('err', 'エラー: ' + e.message);
    }
  }

  function setStatus(type, msg) {
    const el = document.getElementById('statusBar');
    el.innerHTML = `<span class="status-${type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info'}">${msg}</span>`;
  }

  document.getElementById('btnConvert').addEventListener('click', doConvert);

  // Auto-convert on input change (debounced)
  let debTimer;
  document.getElementById('inputArea').addEventListener('input', () => {
    clearTimeout(debTimer);
    debTimer = setTimeout(doConvert, 600);
    const val = document.getElementById('inputArea').value;
    document.getElementById('dropHint').classList.toggle('hidden', val.length > 0);
  });

  // ===== Copy =====
  document.getElementById('btnCopy').addEventListener('click', async () => {
    const text = document.getElementById('outputArea').textContent;
    if (!text || text === '変換結果がここに表示されます') return;
    try {
      await navigator.clipboard.writeText(text);
      const btn = document.getElementById('btnCopy');
      btn.classList.add('copied');
      btn.textContent = '✓ コピー完了';
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<span>&#128203;</span> コピー'; }, 1800);
    } catch {
      setStatus('err', 'クリップボードへのコピーに失敗しました');
    }
  });

  // ===== Download =====
  document.getElementById('btnDownload').addEventListener('click', () => {
    const text = document.getElementById('outputArea').textContent;
    if (!text || text === '変換結果がここに表示されます') return;
    const isJson = currentMode === 'json2csv' ? false : true;
    const ext = isJson ? 'json' : 'csv';
    const mime = isJson ? 'application/json' : 'text/csv';
    const bom = document.getElementById('chkBom').checked && !isJson;
    const bytes = bom
      ? new Uint8Array([0xEF, 0xBB, 0xBF, ...new TextEncoder().encode(text)])
      : new TextEncoder().encode(text);
    const blob = new Blob([bytes], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'converted.' + ext;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ===== Paste from clipboard =====
  document.getElementById('btnPasteClip').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('inputArea').value = text;
      document.getElementById('dropHint').classList.add('hidden');
      doConvert();
    } catch {
      setStatus('err', 'クリップボードの読み取りに失敗しました（ブラウザの許可が必要）');
    }
  });

  // ===== Clear =====
  document.getElementById('btnClear').addEventListener('click', () => {
    document.getElementById('inputArea').value = '';
    document.getElementById('outputArea').textContent = '変換結果がここに表示されます';
    document.getElementById('dropHint').classList.remove('hidden');
    setStatus('info', 'クリアしました');
  });

  // ===== Swap =====
  document.getElementById('btnSwap').addEventListener('click', () => {
    const out = document.getElementById('outputArea').textContent;
    if (!out || out === '変換結果がここに表示されます') return;
    document.getElementById('inputArea').value = out;
    document.getElementById('dropHint').classList.add('hidden');
    // flip mode
    if (currentMode === 'csv2json') {
      document.querySelector('[data-mode="json2csv"]').click();
    } else {
      document.querySelector('[data-mode="csv2json"]').click();
    }
    doConvert();
  });

  // ===== File open =====
  document.getElementById('btnFileOpen').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    readFile(file);
    e.target.value = '';
  });

  function readFile(file) {
    const reader = new FileReader();
    reader.onload = ev => {
      let text = ev.target.result;
      text = stripBom(text);
      document.getElementById('inputArea').value = text;
      document.getElementById('dropHint').classList.add('hidden');
      // Auto-detect mode from extension
      if (file.name.endsWith('.json')) {
        document.querySelector('[data-mode="json2csv"]').click();
      } else if (file.name.endsWith('.tsv')) {
        document.querySelector('[data-mode="tsv2json"]').click();
      } else {
        document.querySelector('[data-mode="csv2json"]').click();
      }
      doConvert();
    };
    reader.readAsText(file, 'UTF-8');
  }

  // ===== Drag & Drop =====
  const dropZone = document.getElementById('dropZone');
  ['dragenter', 'dragover'].forEach(evt => {
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  });
  ['dragleave', 'drop'].forEach(evt => {
    dropZone.addEventListener(evt, e => { e.preventDefault(); dropZone.classList.remove('drag-over'); });
  });
  dropZone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) { readFile(file); return; }
    const text = e.dataTransfer.getData('text');
    if (text) {
      document.getElementById('inputArea').value = text;
      document.getElementById('dropHint').classList.add('hidden');
      doConvert();
    }
  });

  // ===== History =====
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
  }
  function saveHistoryToStorage(hist) {
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }
  function renderHistory() {
    const hist = loadHistory();
    const list = document.getElementById('historyList');
    document.getElementById('histCount').textContent = `(${hist.length}件)`;
    list.innerHTML = '';
    if (hist.length === 0) {
      list.innerHTML = '<p style="font-size:13px;color:var(--row-tan);">履歴はまだありません</p>';
      return;
    }
    hist.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <span class="hist-meta">${item.mode} | ${item.date}</span>
        <span class="hist-preview">${escHtml(item.preview)}</span>
        <button class="hist-del" data-idx="${idx}" title="削除">&#10005;</button>
      `;
      div.addEventListener('click', e => {
        if (e.target.classList.contains('hist-del')) return;
        document.getElementById('inputArea').value = item.input;
        document.getElementById('dropHint').classList.add('hidden');
        // restore mode
        const modeBtn = document.querySelector(`[data-mode="${item.mode}"]`);
        if (modeBtn) modeBtn.click();
        doConvert();
      });
      div.querySelector('.hist-del').addEventListener('click', e => {
        e.stopPropagation();
        const h = loadHistory();
        h.splice(idx, 1);
        saveHistoryToStorage(h);
        renderHistory();
      });
      list.appendChild(div);
    });
  }

  document.getElementById('btnSaveHistory').addEventListener('click', () => {
    const input = document.getElementById('inputArea').value.trim();
    if (!input) { setStatus('err', '保存する内容がありません'); return; }
    const hist = loadHistory();
    const entry = {
      mode: currentMode,
      input,
      preview: input.slice(0, 80),
      date: new Date().toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
    };
    hist.unshift(entry);
    if (hist.length > MAX_HIST) hist.pop();
    saveHistoryToStorage(hist);
    renderHistory();
    setStatus('ok', '履歴に保存しました');
  });

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Init
  updateBadges();
  renderHistory();
</script>
</body>
</html>
